<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#070706" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/manrope-latin-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/cormorant-garamond-latin-variable.woff2" as="font" type="font/woff2" crossorigin />
    <title>404 — VHOX</title>
    <style>
      @font-face { font-family: Manrope; src: url('/fonts/manrope-latin-variable.woff2') format('woff2'); font-weight: 200 800; font-display: swap; }
      @font-face { font-family: "Cormorant Garamond"; src: url('/fonts/cormorant-garamond-latin-variable.woff2') format('woff2'); font-weight: 300 700; font-display: swap; }
      :root { color-scheme: dark; font-family: Manrope, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 1.5rem; background: #070706; color: #f1eee7; }
      main { width: min(70rem, 100%); border-top: 1px solid #444; padding-top: 1rem; }
      img { display: block; width: min(22rem, 72vw); height: auto; margin: 0; }
      p { color: #999; font-size: .65rem; letter-spacing: .18em; }
      h1 { margin: 10vh 0 4rem; font-family: "Cormorant Garamond", serif; font-size: clamp(5rem, 20vw, 16rem); font-weight: 450; line-height: .72; letter-spacing: -.06em; }
      a { display: inline-block; padding: 1rem; border: 1px solid #555; color: inherit; font-size: .65rem; letter-spacing: .12em; text-decoration: none; text-transform: uppercase; }
      a:hover, a:focus-visible { background: #7cff00; color: #050505; outline: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/vhox-logo-source.png" width="1254" height="1254" alt="VHOX" />
      <p>VHOX / OUTSIDE THE SYSTEM</p>
      <h1>404.</h1>
      <a href="/">Return to VHOX</a>
    </main>
  </body>
</html>
